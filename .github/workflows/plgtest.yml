name: Package PLG test
on:
  workflow_dispatch:
jobs:
  package_and_update:
    permissions: write-all
    runs-on: ubuntu-latest
    container: bobbintb/unraid-cicd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download UnRAID-Plugin-Generator
        run: |
          cd ./.plugin
          wget https://raw.githubusercontent.com/bobbintb/UnRAID-Plugin-Generator/main/upg.py
          wget https://raw.githubusercontent.com/bobbintb/UnRAID-Plugin-Generator/main/requirements.txt
          chmod +x upg.py
      - name: Run UnRAID-Plugin-Generator
        run: |
          slackpkg update
          slackpkg install expat
          cd ./.plugin
          pip install -r requirements.txt
          rm requirements.txt
          ./upg.py bobbintb.system.dirt.toml -o bobbintb.system.dirt.plg
          rm upg.py
          ls -ls
      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          TAG: ${{ env.TAG }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: test
          make_latest: false
          files: |
            *.txz
            *.plg
